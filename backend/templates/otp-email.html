<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { width: 90%; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { font-size: 24px; color: #333; }
        .otp-code { font-size: 28px; font-weight: bold; color: #007BFF; margin: 20px 0; }
        .footer { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Udaan - OTP Verification</div>
        <p>Hi there,</p>
        <p>Thank you for registering. Please use the following One-Time Password (OTP) to complete your verification:</p>
        
        <div class="otp-code">{{OTP}}</div>
        
        <p>This OTP will expire in <strong>{{EXPIRATION}}</strong>.</p>
        <p>If you did not request this, please ignore this email.</p>
        <br>
        <div class="footer">
            &copy; 2025 Udaan. All rights reserved.
        </div>
    </div>
</body>
</html>
